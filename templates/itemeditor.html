<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Item Editor — The Black Whale</title>
  <script src="../static/app-routing.js"></script>
  <script src="../static/nav-auth.js" defer></script>
  <link rel="stylesheet" href="../static/style.css">
</head>
<body>
  <video class="background-video" autoplay loop muted playsinline preload="auto">
    <source src="../static/whalebackground.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>
  <div class="page-frame">
    <header class="site-header">
      <a class="site-brand" href="/">
        <img class="site-logo" src="../static/newblackwhale.png" alt="The Black Whale logo">
        <span>The Black Whale</span>
      </a>
      <nav class="site-nav">
        <a href="/inventory">Inventory</a>
        <a href="/seller">Seller</a>
        <a href="/logout">Logout</a>
      </nav>
    </header>
    <main class="page-shell">
      <section class="panel form-card">
        <div>
          <h1 class="section-title">Item Editor</h1>
          <p class="section-copy">Create a fish listing. Each saved item gets its own dedicated product page.</p>
        </div>
        <div id="editorMessage" class="error-message" style="display:none;"></div>
        <div class="form-group">
          <label for="title">Product title</label>
          <input id="title" type="text" placeholder="Enter product name">
        </div>
        <div class="input-row">
          <div class="form-group">
            <label for="price">Price</label>
            <input id="price" type="number" min="0" step="0.01" placeholder="0.00">
          </div>
          <div class="form-group">
            <label for="stock">Stock</label>
            <input id="stock" type="number" placeholder="0">
          </div>
        </div>
        <div class="form-group">
          <label for="productImage">Product image</label>
          <input id="productImage" type="file" accept="image/png,image/jpeg,image/gif,image/webp">
          <div id="imagePreview" style="display:none;margin-top:8px;">
            <img id="previewImg" src="" alt="Preview" style="max-height:180px;max-width:100%;border-radius:8px;object-fit:cover;">
          </div>
        </div>
        <div class="form-group">
          <label for="nutrition">Nutritional value</label>
          <textarea id="nutrition" placeholder="Per 100g: Protein 20g, Omega-3 2g, Calories 180"></textarea>
        </div>
        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" placeholder="Describe the product..."></textarea>
        </div>
        <div class="button-row">
          <button id="saveProductButton" class="button button-primary" type="button">Save product</button>
          <button id="deleteProductButton" class="button button-secondary" type="button" style="display:none;">Delete product</button>
          <button class="button button-secondary" type="button" onclick="window.location.href=appUrl('/seller')">Cancel</button>
        </div>
      </section>
    </main>
    <footer class="site-footer">© 2026 The Black Whale</footer>
  </div>
  <div class="page-transition-overlay active">
  </div>
  <script>
    (function() {
      const overlay = document.querySelector('.page-transition-overlay');
      const internalLinks = Array.from(document.querySelectorAll('a[href]')).filter(link => {
        const href = link.getAttribute('href');
        return href && href.endsWith('.html') && !href.startsWith('http') && !href.startsWith('#');
      });

      const navigate = (href) => {
        document.body.classList.add('transitioning');
        overlay.classList.add('active');
        setTimeout(() => { window.location.href = href; }, 420);
      };

      internalLinks.forEach(link => {
        link.addEventListener('click', (event) => {
          event.preventDefault();
          navigate(link.getAttribute('href'));
        });
      });

      window.addEventListener('pageshow', () => {
        document.body.classList.remove('transitioning');
        overlay.classList.remove('active');
      });

      const saveButton = document.getElementById('saveProductButton');
      const deleteButton = document.getElementById('deleteProductButton');
      const editorMessage = document.getElementById('editorMessage');
      const imageInput = document.getElementById('productImage');
      const imagePreview = document.getElementById('imagePreview');
      const previewImg = document.getElementById('previewImg');
      const params = new URLSearchParams(window.location.search);
      const editProductId = params.get('edit');
      let currentImageUrl = '';

      async function loadProductForEdit(productId) {
        try {
          const response = await fetch(appUrl('/api/vendor/products/' + productId));
          const data = await response.json();
          if (!response.ok || !data.success || !data.product) {
            throw new Error(data.message || 'Unable to load product');
          }

          const product = data.product;
          document.querySelector('.section-copy').textContent = 'Edit this product and keep the listing current.';
          document.title = 'Edit Product — The Black Whale';
          document.getElementById('title').value = product.title || '';
          document.getElementById('price').value = product.price ?? '';
          document.getElementById('stock').value = product.inventory ?? '';
          document.getElementById('nutrition').value = product.nutritional_value || '';
          document.getElementById('description').value = product.description || '';
          saveButton.textContent = 'Update product';
          deleteButton.style.display = 'inline-flex';
          currentImageUrl = product.image_url || '';
          if (currentImageUrl) {
            previewImg.src = currentImageUrl;
            imagePreview.style.display = 'block';
          }
        } catch (error) {
          editorMessage.textContent = error.message || 'Unable to load product for editing.';
          editorMessage.style.display = 'block';
          saveButton.disabled = true;
          deleteButton.disabled = true;
        }
      }

      imageInput.addEventListener('change', () => {
        const file = imageInput.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = e => {
            previewImg.src = e.target.result;
            imagePreview.style.display = 'block';
          };
          reader.readAsDataURL(file);
        } else {
          imagePreview.style.display = 'none';
        }
      });

      async function saveProduct() {
        const title = document.getElementById('title').value.trim();
        const price = document.getElementById('price').value;
        const stock = document.getElementById('stock').value;
        const nutrition = document.getElementById('nutrition').value.trim();
        const description = document.getElementById('description').value.trim();

        editorMessage.style.display = 'none';

        if (!title || !price || !description) {
          editorMessage.textContent = 'Title, price, and description are required.';
          editorMessage.style.display = 'block';
          return;
        }

        saveButton.disabled = true;
        deleteButton.disabled = true;

        try {
          const formData = new FormData();
          formData.append('title', title);
          formData.append('price', price);
          formData.append('stock', stock || 0);
          formData.append('nutritional_value', nutrition);
          formData.append('description', description);
          if (imageInput.files[0]) {
            formData.append('image', imageInput.files[0]);
          }

          const response = await fetch(appUrl(editProductId ? '/api/vendor/products/' + editProductId : '/api/products'), {
            method: editProductId ? 'PUT' : 'POST',
            body: formData
          });

          const data = await response.json();
          if (!response.ok || !data.success) {
            throw new Error(data.message || 'Failed to save product.');
          }

          window.location.href = appUrl(data.redirect);
        } catch (error) {
          editorMessage.textContent = error.message || 'Failed to save product.';
          editorMessage.style.display = 'block';
          saveButton.disabled = false;
          deleteButton.disabled = false;
        }
      }

      async function deleteProduct() {
        if (!editProductId) {
          return;
        }

        const confirmed = window.confirm('Remove this product from the market? It will no longer be visible to customers.');
        if (!confirmed) {
          return;
        }

        deleteButton.disabled = true;
        saveButton.disabled = true;

        try {
          const response = await fetch(appUrl('/api/vendor/products/' + editProductId), {
            method: 'DELETE'
          });
          const data = await response.json();
          if (!response.ok || !data.success) {
            throw new Error(data.message || 'Failed to delete product.');
          }

          window.location.href = appUrl('/seller');
        } catch (error) {
          editorMessage.textContent = error.message || 'Failed to delete product.';
          editorMessage.style.display = 'block';
          saveButton.disabled = false;
          deleteButton.disabled = false;
        }
      }

      saveButton.addEventListener('click', saveProduct);
      deleteButton.addEventListener('click', deleteProduct);

      if (editProductId) {
        loadProductForEdit(editProductId);
      }
    })();
  </script>
</body>
</html>
