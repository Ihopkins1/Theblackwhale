<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Available - The Black Whale</title>
  <script src="../static/app-routing.js"></script>
  <script src="../static/nav-auth.js" defer></script>
  <link rel="stylesheet" href="../static/style.css">
</head>
<body>
  <video class="background-video" autoplay loop muted playsinline preload="auto">
    <source src="../static/whalebackground.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>
  <div class="page-frame">
    <header class="site-header">
      <a class="site-brand" href="/">
        <img class="site-logo" src="../static/newblackwhale.png" alt="The Black Whale logo">
        <span>The Black Whale</span>
      </a>
      <nav class="site-nav"></nav>
    </header>

    <main class="page-shell">
      <section class="panel" style="max-width: 680px; margin: 2rem auto; text-align: center;">
        <p class="badge">Request Error</p>
        <h1 class="section-title" style="margin-top: 0.75rem;">We could not load this page</h1>
        <p class="section-copy" style="margin: 0 auto 1.5rem;">
          {{ message or 'The requested resource is not available.' }}
        </p>
        <div class="button-row" style="justify-content: center;">
          <a class="button button-primary" href="/shop">Go to Shop</a>
          <a class="button button-secondary" href="/account">View Account</a>
        </div>
      </section>
    </main>

    <footer class="site-footer">© 2026 The Black Whale</footer>
  </div>
  <div class="page-transition-overlay active"></div>

  <script>
    (function () {
      const overlay = document.querySelector('.page-transition-overlay');
      window.addEventListener('pageshow', () => {
        document.body.classList.remove('transitioning');
        overlay.classList.remove('active');
      });
    })();
  </script>
</body>
</html>
