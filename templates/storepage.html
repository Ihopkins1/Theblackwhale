<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store Page — The Black Whale</title>
  <script src="../static/app-routing.js"></script>
  <script src="../static/nav-auth.js" defer></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <video class="background-video" autoplay loop muted playsinline preload="auto">
    <source src="/static/whalebackground.mp4" type="video/mp4">
  </video>
  <div class="page-frame">
    <header class="site-header">
      <a class="site-brand" href="/">
        <img class="site-logo" src="/static/newblackwhale.png" alt="The Black Whale logo">
        <span>The Black Whale</span>
      </a>
      <nav class="site-nav">
        <a href="/inventory">Inventory</a>
        <a href="/seller">Seller</a>
        <a href="/sign-in">Sign In</a>
      </nav>
    </header>
    <main class="page-shell">
      <section class="panel hero">
        <div>
          <h1 class="section-title">Welcome to The Black Whale</h1>
          <p class="section-copy"></p>
          <div class="hero-actions">
            <a class="button button-primary" href="#products">Browse Products</a>
            <a class="button button-secondary" href="/about">Learn More</a>
          </div>
        </div>
      </section>

      <section class="panel" id="products">
        <div>
          <h2 class="section-title">Featured Fish</h2>
          <p class="section-copy">Each listing opens its own product page with seller info, delivery estimate, and nutrition facts.</p>
        </div>
        <div id="productGrid" class="grid"></div>
      </section>

    </main>
    <footer class="site-footer">© 2026 The Black Whale</footer>
  </div>
  <div class="page-transition-overlay active">
    <img src="/static/newblackwhale.png" alt="The Black Whale logo">
  </div>
  <script>
    (function() {
      const overlay = document.querySelector('.page-transition-overlay');
      const internalLinks = Array.from(document.querySelectorAll('a[href]')).filter(link => {
        const href = link.getAttribute('href');
        return href && href.endsWith('.html') && !href.startsWith('http') && !href.startsWith('#');
      });

      const navigate = (href) => {
        document.body.classList.add('transitioning');
        overlay.classList.add('active');
        setTimeout(() => { window.location.href = href; }, 420);
      };

      internalLinks.forEach(link => {
        link.addEventListener('click', (event) => {
          event.preventDefault();
          navigate(link.getAttribute('href'));
        });
      });

      window.addEventListener('pageshow', () => {
        document.body.classList.remove('transitioning');
        overlay.classList.remove('active');
      });

      function renderProductCard(product) {
        const card = document.createElement('article');
        card.className = 'card';
        card.innerHTML = `
          <img src="${product.image_url || '/static/newblackwhale.png'}" alt="${product.title}" style="width:100%;height:180px;object-fit:cover;border-radius:12px;margin-bottom:12px;">
          <h3>${product.title}</h3>
          <p>${product.description}</p>
          <p><strong>Price:</strong> $${Number(product.price).toFixed(2)}</p>
          <a class="button button-primary" href="${appUrl('/product/' + product.product_id)}">View Fish</a>
        `;
        return card;
      }

      async function loadProducts() {
        const productGrid = document.getElementById('productGrid');
        if (!productGrid) return;

        const fallbackProducts = [
          {
            product_id: 1,
            title: 'Atlantic Salmon Fillet',
            description: 'Fresh-cut salmon fillet with rich flavor and smooth texture.',
            price: 18.99,
            image_url: 'https://images.unsplash.com/photo-1467003909585-2f8a72700288?auto=format&fit=crop&w=1200&q=80'
          },
          {
            product_id: 2,
            title: 'Yellowfin Tuna Steak',
            description: 'Lean premium tuna steak with a firm bite, perfect for searing.',
            price: 21.5,
            image_url: 'https://images.unsplash.com/photo-1519708227418-c8fd9a32b7a2?auto=format&fit=crop&w=1200&q=80'
          },
          {
            product_id: 3,
            title: 'Whole Red Snapper',
            description: 'Whole cleaned red snapper ideal for roasting with herbs and citrus.',
            price: 26.0,
            image_url: 'https://images.unsplash.com/photo-1600891964092-4316c288032e?auto=format&fit=crop&w=1200&q=80'
          }
        ];

        function renderMany(products) {
          productGrid.innerHTML = '';
          products.forEach((product) => {
            productGrid.appendChild(renderProductCard(product));
          });
        }

        try {
          const response = await fetch(appUrl('/api/store-products'));
          if (!response.ok) {
            throw new Error('Products API unavailable');
          }
          const data = await response.json();

          if (!data.success || !Array.isArray(data.products) || data.products.length === 0) {
            renderMany(fallbackProducts);
            return;
          }

          renderMany(data.products);
        } catch (error) {
          renderMany(fallbackProducts);
        }
      }

      loadProducts();
    })();
  </script>
</body>
</html>
